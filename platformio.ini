; CYD-Weather — wttr.in ASCII weather on the "Cheap Yellow Display" (ESP32-2432S028R)

[env:cyd]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

; TFT_eSPI is configured here instead of editing its User_Setup.h
build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000

; Some CYD boards (the "2 USB" version with USB-C + micro-USB) use an ST7789
; panel. If the picture has wrong/inverted colours, try this env instead:
;   pio run -e cyd2usb -t upload
;[env:cyd2usb]
;extends = env:cyd
;build_flags =
;    ${env:cyd.build_flags}
;    -UILI9341_2_DRIVER
;    -DST7789_DRIVER=1
;    -DTFT_RGB_ORDER=TFT_BGR
;    -DTFT_INVERSION_OFF=1
